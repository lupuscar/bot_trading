{% if schema %}
    <div class="grid grid-cols-2 gap-4" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem;">
    {% for key, field in schema.items %}
        <div class="form-group">
            <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-muted);">
                {{ key|title }}
            </label>
            
            {% if field.choices %}
                <select name="param_{{ key }}" class="form-control" style="width: 100%; padding: 0.8rem; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: white; border-radius: 6px;">
                    {% for choice in field.choices %}
                        <option value="{{ choice }}" {% if field.default == choice %}selected{% endif %}>{{ choice }}</option>
                    {% endfor %}
                </select>
            {% else %}
                <input type="{% if field.type == 'number' or field.type == 'int' %}number{% else %}text{% endif %}" 
                       name="param_{{ key }}" 
                       class="form-control" 
                       style="width: 100%; padding: 0.8rem; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: white; border-radius: 6px;"
                       value="{{ field.default }}"
                       {% if field.min is not None %}min="{{ field.min }}"{% endif %}
                       {% if field.max is not None %}max="{{ field.max }}"{% endif %}
                       {% if field.type == 'number' %}step="0.01"{% endif %}>
            {% endif %}
            
            {% if field.description %}
            <span style="font-size: 0.75rem; color: var(--text-muted); display: block; margin-top: 0.25rem;">{{ field.description }}</span>
            {% endif %}
        </div>
    {% endfor %}
    </div>
{% else %}
    <div style="padding: 1rem; background: rgba(255,255,255,0.05); border-radius: 6px; text-align: center; color: var(--text-muted);">
        Selecciona un algoritmo para ver sus parámetros.
    </div>
{% endif %}
